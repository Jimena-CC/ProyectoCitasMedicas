name: Desktop CI & Release Generation

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'desktop/**'
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'desktop/**'

jobs:
  build-and-test:
    name: Compilar y Probar Cliente Desktop
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Verificar si existe el proyecto en desktop
        id: check_files
        run: |
          if [ -f "desktop/pom.xml" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "La carpeta desktop aún no tiene código o pom.xml. Saltando build."
          fi

      - name: Configurar Java 17
        if: steps.check_files.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilar, Probar y Empaquetar
        if: steps.check_files.outputs.exists == 'true'
        run: mvn clean package
        working-directory: desktop

      - name: Guardar Artifact (.jar)
        if: steps.check_files.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-app-jar
          path: desktop/target/*.jar

  create-release:
    name: Publicar Release en GitHub
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v') && needs.build-and-test.result == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Descargar Artifact (.jar)
        uses: actions/download-artifact@v4
        with:
          name: desktop-app-jar
          path: release-build/

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-build/*.jar
          name: Release ${{ github.ref_name }}
          body: |
            ## Novedades de la Versión ${{ github.ref_name }}
            - Ejecutable distribuible de la aplicación de escritorio (`ProyectoCitasMedicas-Desktop.jar`).
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}