name: API CI/CD & Docker Build

on:
  push:
    branches: [main, develop]
    paths:
      - "api/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "api/**"

jobs:
  test-api:
    name: Compilar y Probar API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"
          cache-dependency-path: api/pom.xml # <--- Clave para que funcione la caché en subdirectorios

      - name: Ejecutar Pruebas Unitarias y empaquetar JAR
        working-directory: ./api
        run: mvn clean package -DskipTests=false # 'package' genera el JAR necesario para Docker

  docker-check:
    name: Validar Imagen Docker de la API
    needs: test-api
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # Opcional pero recomendado: Si el Dockerfile necesita el JAR compilado,
      # idealmente se compila en el job anterior y se pasa mediante artifact,
      # o se asegura que Maven corra antes del build de Docker.
      - name: Configurar Java 21 (para compilar JAR previo al Docker build)
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"
          cache-dependency-path: api/pom.xml

      - name: Compilar JAR para Docker
        working-directory: ./api
        run: mvn package -DskipTests

      - name: Construir Imagen Docker
        run: |
          docker build -t citas-medicas-api:latest ./api

  integration-test:
    name: Prueba de Integración Real (Docker Compose + Flyway)
    needs: docker-check
    runs-on: ubuntu-latest
    env:
      SECURITY_JWT_SECRET: ci-clave-de-prueba-solo-para-integracion-2026

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"
          cache-dependency-path: api/pom.xml

      - name: Compilar JAR localmente para Docker Compose
        working-directory: ./api
        run: mvn package -DskipTests

      - name: Levantar API + Postgres
        env:
          SECURITY_JWT_SECRET: ci-clave-de-prueba-solo-para-integracion-2026
        run: docker compose up -d --build --wait

      - name: Verificar que la API responde (healthcheck real)
        run: curl -f http://localhost:8080/actuator/health

      - name: Ver logs si algo falló
        if: failure()
        run: docker compose logs

      - name: Apagar todo
        if: always()
        run: docker compose down -v
