name: API CI/CD & Docker Build

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'api/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'api/**'

jobs:
  test-api:
    name: Compilar y Probar API
    runs-on: ubuntu-latest

    steps:
      # 1. Trae el código del repositorio a la máquina virtual de GitHub
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Instala Java 17 Temurin y activa caché de Maven para ir más rápido
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Corre las pruebas unitarias creadas en Java (JUnit / Mockito)
      - name: Ejecutar Pruebas Unitarias
        run: |
          cd api
          mvn clean test

  docker-check:
    name: Validar Imagen Docker de la API
    needs: test-api # Solo si las pruebas pasan exitosamente
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # 4. Verifica que el Dockerfile de la API compile sin errores
      - name: Construir Imagen Docker
        run: |
          docker build -t citas-medicas-api:latest ./api