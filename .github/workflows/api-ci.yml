name: API CI/CD & Docker Build

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'api/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'api/**'

jobs:
  build-and-test-api:
    name: Compilar, Probar y Validar Docker de API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # Verifica que existan archivos mínimos para no dar error si la carpeta está vacía
      - name: Verificar si existe el proyecto en api
        id: check_files
        run: |
          if [ -f "api/pom.xml" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "La carpeta api aún no tiene código o pom.xml. Saltando build."
          fi

      - name: Configurar Java 17
        if: steps.check_files.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Ejecutar Pruebas Unitarias
        if: steps.check_files.outputs.exists == 'true'
        run: mvn clean test
        working-directory: api

      - name: Construir Imagen Docker
        if: steps.check_files.outputs.exists == 'true' && hashFiles('api/Dockerfile') != ''
        run: docker build -t citas-medicas-api:latest ./api