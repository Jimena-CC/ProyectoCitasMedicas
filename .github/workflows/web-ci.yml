name: Web CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'web/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'web/**'

jobs:
  build-web:
    name: Verificar y Compilar Backoffice Web
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      # 1. Trae el código del repositorio a la máquina virtual de GitHub
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Instala Node 22 LTS y activa la caché de npm a partir del package-lock del módulo web
      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # 3. Instala las dependencias exactas del lockfile (falla si el lock está desactualizado)
      - name: Instalar dependencias
        run: npm ci

      # 4. Reglas de estilo y errores comunes (oxlint)
      - name: Ejecutar Lint
        run: npm run lint

      # 5. Verificación estricta de tipos con TypeScript
      - name: Verificar Tipos
        run: npm run typecheck

      # 6. Compila el sitio estático en web/dist (lo que se despliega en Nginx o como recursos estáticos)
      - name: Compilar Sitio
        run: npm run build
