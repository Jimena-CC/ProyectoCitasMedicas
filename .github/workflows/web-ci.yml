name: Web CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'web/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'web/**'

jobs:
  build-web:
    name: Verificar y Compilar Backoffice Web
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      # 1. Trae el código del repositorio
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar Node 22
      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # 3. Instalar dependencias tolerando conflictos de React 19 (Usa npm install en lugar de npm ci si hay problemas de lock)
      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      # 4. Reglas de estilo y errores comunes (oxlint)
      - name: Ejecutar Lint
        run: npm run lint

      # 5. Verificación estricta de tipos con TypeScript
      - name: Verificar Tipos
        run: npm run typecheck

      # 6. Compilar el sitio estático inyectando variables dummy de entorno para el build
      - name: Compilar Sitio
        env:
          VITE_API_URL: https://api.tudominio.com/api/v1
          VITE_IDLE_MINUTES: 30
        run: npm run build