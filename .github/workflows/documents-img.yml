name: Renderizar Diagramas PlantUML

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'doc/diagramas/**/*.puml'
  workflow_dispatch:

jobs:
  render-diagrams:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Instalar PlantUML y Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y plantuml graphviz

      - name: Generar imágenes en doc/diagramas/img/
        run: |
          mkdir -p doc/diagramas/img
          plantuml -tsvg -o img "doc/diagramas/**/*.puml"
          plantuml -tpng -o img "doc/diagramas/**/*.puml"

      - name: Hacer Commit y Push a la rama origen del PR
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add doc/diagramas/img/
          git status
          git diff-index --quiet HEAD || (git commit -m "chore(docs): actualizar imágenes en doc/diagramas/img/" && git push)