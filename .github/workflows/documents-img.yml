name: Renderizar Diagramas PlantUML

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'doc/diagramas/**/*.puml'
  workflow_dispatch:

jobs:
  render-diagrams:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del repositorio (fetch-depth 0 para tener acceso al branch del PR)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Renderizar archivos PlantUML a SVG y PNG
        uses: cloudbees/plantuml-github-action@v2
        with:
          args: -tsvg -tpng doc/diagramas/**/*.puml

      - name: Hacer Commit y Push a la rama origen del PR
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add doc/diagramas/
          git status
          git diff-index --quiet HEAD || (git commit -m "chore(docs): actualizar imágenes de diagramas generados" && git push)