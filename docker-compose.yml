services:
  postgres-db:
    image: postgres:15-alpine
    container_name: citas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-citas_medicas_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-citas_medicas_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-service:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: citas_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/${POSTGRES_DB:-citas_medicas_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      
      # AQUÍ ESTÁN LAS VARIABLES QUE LEE TU application.properties:
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET:?Define SECURITY_JWT_SECRET en el .env}
      SECURITY_JWT_EXPIRATION_MINUTES: ${SECURITY_JWT_EXPIRATION_MINUTES:-480}
      SECURITY_CORS_ALLOWED_ORIGINS: ${SECURITY_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      SECURITY_AUDIT_TRUST_FORWARDED_FOR: ${SECURITY_AUDIT_TRUST_FORWARDED_FOR:-false}
      
    depends_on:
      postgres-db:
        condition: service_healthy

  web-frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8080/api/v1}
        - VITE_IDLE_MINUTES=${VITE_IDLE_MINUTES:-30}
    container_name: citas_web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api-service

volumes:
  postgres_data: