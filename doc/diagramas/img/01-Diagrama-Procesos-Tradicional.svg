" x="152" y="50.4063">Enfermera / Personal de Atención</text><line style="stroke: #000000; stroke-width: 2.0;" x1="10" x2="10" y1="33.6982" y2="829.7412"/><line style="stroke: #000000; stroke-width: 2.0;" x1="132" x2="132" y1="33.6982" y2="829.7412"/><line style="stroke: #000000; stroke-width: 2.0;" x1="474" x2="474" y1="33.6982" y2="829.7412"/><!--MD5=[4382a4d6aace086a2f0e0617836eccf0]
@startuml
title Proceso de Reserva de Cita - Atención Personal

|Paciente|
start
:Solicitar cita;

|Enfermera / Personal de Atención|
:Identificar paciente;

if (¿Paciente registrado?) then (No)
  :Registrar paciente;
endif

:Validar aseguradora;
:Consultar especialidad;
:Consultar disponibilidad;

if (¿Hay disponibilidad?) then (No)
  :Informar falta de cupos;
  stop
else (Sí)
  :Seleccionar horario;
endif

:Registrar cita;

|Paciente|
:Confirmar cita;

|Enfermera / Personal de Atención|
:Confirmar reserva;

|Paciente|
stop

@enduml

