# Demo local sin Docker: base en memoria que se recrea en cada arranque.
# El nombre aleatorio evita que dos contextos de prueba compartan la misma base.
spring.datasource.url=jdbc:h2:mem:medicitas_${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Carga los datos de demostración (sedes, especialidades, médicos, cupos y pacientes)
clinic.demo-data=true
