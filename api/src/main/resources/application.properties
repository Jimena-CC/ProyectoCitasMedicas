spring.application.name=medicitas-api

# Perfil por defecto: H2 en memoria con datos de demostración (no requiere Docker).
# Para PostgreSQL: SPRING_PROFILES_ACTIVE=postgres
spring.profiles.default=h2

server.port=8080
server.error.include-stacktrace=never
server.error.include-message=never

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
spring.jackson.time-zone=America/Lima

# Zona horaria de la clínica para "hoy", disponibilidad y recordatorios
clinic.time-zone=America/Lima

# Servicio de Mensajería simulado (RF-11 a RF-14)
messaging.simulate-failure=false
messaging.max-attempts=3
messaging.retry-minutes=10
messaging.reminder-hours-ahead=24
messaging.job-interval-ms=300000

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.flyway.enabled=false

# Seguridad del personal (RNF-02): JWT firmado con clave HMAC. Cambia la clave fuera de desarrollo.
security.jwt.secret=${SECURITY_JWT_SECRET:medicitas-anglo-clave-de-desarrollo-cambiar-en-produccion-2026}
security.jwt.expiration-minutes=${SECURITY_JWT_EXPIRATION_MINUTES:480}
# Orígenes del navegador autorizados a llamar a la API (paneles web del personal)
security.cors.allowed-origins=${SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:5173}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never