# PostgreSQL 15 (docker-compose). El esquema lo crea docs/database/initial_schema.sql
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/citas_medicas_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate

# Carga los datos de demostración solo si la base está vacía (primer arranque)
clinic.demo-data=${CLINIC_DEMO_DATA:true}
